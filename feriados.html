<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Días No Laborables - Gestión de Cronograma</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header></header>

  <div class="container">
    <div class="section-card">
      <h2><i class="fas fa-calendar-alt"></i> Configuración de Días No Laborables y Feriados</h2>
      <p class="section-desc">
        Los sábados y domingos quedan excluidos automáticamente por el motor de cálculo[cite: 1, 2]. Ingresa los feriados nacionales, provinciales o asuetos específicos en formato <strong>dd.mm.yyyy</strong> (uno por línea)[cite: 1, 2].
      </p>

      <textarea id="txtFeriados" rows="12" placeholder="Ejemplo:&#10;25.05.2026&#10;15.06.2026&#10;20.06.2026&#10;09.07.2026"></textarea>
      
      <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center;">
        <button class="btn-main" id="btnGuardarFeriados">
          <i class="fas fa-save"></i> Guardar Días No Laborables
        </button>
        <span id="contadorFeriados" style="font-size: 0.9rem; color: #005f85; font-weight: 600;"></span>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script>
    // Control de acceso: Exclusivo Administrador
    const usuarioActual = verificarSesion();
    if (!usuarioActual || usuarioActual.perfil !== 'Administrador') {
      window.location.replace('aprobaciones.html');
    }

    renderizarNavbar('feriados');

    const txtFeriados = document.getElementById('txtFeriados');
    const contadorFeriados = document.getElementById('contadorFeriados');

    function actualizarContador() {
      const lineas = txtFeriados.value.split('\n').map(l => l.trim()).filter(Boolean);
      contadorFeriados.innerText = `${lineas.length} día(s) no laborable(s) registrado(s)`;
    }

    // Carga inicial desde almacenamiento local
    txtFeriados.value = localStorage.getItem('assa_feriados') || '';
    actualizarContador();

    txtFeriados.addEventListener('input', actualizarContador);

    document.getElementById('btnGuardarFeriados').addEventListener('click', () => {
      // Normalizar texto: eliminar líneas vacías o espacios extras
      const listaLimpia = txtFeriados.value
        .split('\n')
        .map(f => f.trim())
        .filter(Boolean)
        .join('\n');

      localStorage.setItem('assa_feriados', listaLimpia);
      txtFeriados.value = listaLimpia;
      actualizarContador();
      alert('Días no laborables actualizados con éxito. Impactarán de inmediato en los cálculos de Planificación.');
    });
  </script>
</body>
</html>
