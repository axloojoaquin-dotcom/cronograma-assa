<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista UL´s - Catálogo Maestro de Rutas</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  
  <style>
    .uls-filter-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }
    .filter-controls {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 280px;
    }
    .filter-controls select, .filter-controls input {
      padding: 8px 12px;
      border: 1px solid #cce0f5;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .filter-controls select {
      max-width: 240px;
      background: white;
      font-weight: 600;
      color: #005f85;
    }
    .filter-controls input {
      flex: 1;
    }
    .btn-action-edit {
      background-color: #f0ad4e;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      margin-right: 5px;
      transition: background-color 0.2s;
    }
    .btn-action-edit:hover {
      background-color: #ec971f;
    }
    .btn-action-delete {
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn-action-delete:hover {
      background-color: #c9302c;
    }
    
    /* Modal de Modificación */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .modal-card h3 {
      margin-bottom: 15px;
      color: #0066cc;
      border-bottom: 2px solid #eef6fc;
      padding-bottom: 8px;
    }
    .modal-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .modal-group label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #444;
    }
    .modal-group input, .modal-group select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.95rem;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <header></header>

  <div class="container">
    <div class="section-card">
      <h2>Lista UL´s (Catálogo de Rutas y Distritos)</h2>
      <p class="section-desc">Cualquier ruta agregada, modificada o eliminada aquí impactará de forma automática e inmediata en la selección de Planificación[cite: 1, 3].</p>

      <!-- Formulario para agregar -->
      <div class="uls-form-grid">
        <div class="input-inline">
          <label for="ulDistritoSelect">Distrito:</label>
          <select id="ulDistritoSelect"></select>
        </div>
        <div class="input-inline">
          <label for="ulRutaInput">Código de Ruta / UL:</label>
          <input type="text" id="ulRutaInput" placeholder="Ej: 098099 o UN098001">
        </div>
        <button class="btn-main" id="btnAgregarRuta"><i class="fas fa-plus"></i> Agregar Ruta</button>
        <button class="btn-sub" id="btnResetRutasDefault" style="margin-left: auto;"><i class="fas fa-sync"></i> Restablecer Catálogo Base</button>
      </div>

      <!-- Barra de Filtros Rápida -->
      <div class="uls-filter-bar">
        <div class="filter-controls">
          <select id="filtroDistritoSelect">
            <option value="">-- Todos los Distritos --</option>
          </select>
          <input type="text" id="filtroUls" placeholder="Buscar por código de ruta o texto...">
        </div>
        <span id="contadorUls" style="font-weight: 600; color: #005f85; white-space: nowrap;"></span>
      </div>

      <!-- Tabla Principal -->
      <div class="uls-table-container">
        <table class="styled-table">
          <thead>
            <tr>
              <th style="width: 130px;">Cód. Distrito</th>
              <th>Nombre Distrito</th>
              <th>Ruta / Unidad de Lectura</th>
              <th style="width: 170px; text-align: center;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyUls"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal para Editar Ruta -->
  <div id="modalEditarRuta" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3><i class="fas fa-edit"></i> Modificar Ruta / UL</h3>
      <div class="modal-group">
        <label for="editDistritoSelect">Distrito Destino:</label>
        <select id="editDistritoSelect"></select>
      </div>
      <div class="modal-group">
        <label for="editRutaInput">Código de Ruta:</label>
        <input type="text" id="editRutaInput" placeholder="Ej: 098001A">
      </div>
      <div class="modal-actions">
        <button class="btn-sub" onclick="cerrarModalEdicion()">Cancelar</button>
        <button class="btn-main" id="btnGuardarEdicion"><i class="fas fa-save"></i> Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script src="../shared.js"></script>
  <script>
    // Control de acceso: Exclusivo Administrador
    const usuarioActual = verificarSesion();
    if (!usuarioActual || usuarioActual.perfil !== 'Administrador') {
      window.location.replace('aprobaciones.html');
    }

    renderizarNavbar('lista-uls');
    let rutasBase = getRutasBase();

    let edicionActual = { distritoOrig: null, rutaOrig: null };

    function renderSelectDistritos() {
      const selAgregar = document.getElementById('ulDistritoSelect');
      const selFiltro = document.getElementById('filtroDistritoSelect');
      const selModal = document.getElementById('editDistritoSelect');

      const opcionesDistritos = Object.keys(rutasBase).sort().map(id => {
        return `<option value="${id}">${id} - ${rutasBase[id].nombre}</option>`;
      }).join('');

      selAgregar.innerHTML = opcionesDistritos;
      selModal.innerHTML = opcionesDistritos;
      selFiltro.innerHTML = '<option value="">-- Todos los Distritos --</option>' + opcionesDistritos;
    }

    function renderTabla() {
      const q = (document.getElementById('filtroUls').value || '').trim().toLowerCase();
      const dFiltro = document.getElementById('filtroDistritoSelect').value;
      const tbody = document.getElementById('tbodyUls');
      
      let totalRutas = 0;
      let coincidencias = 0;
      const filasHtml = [];

      const distritosAProcesar = dFiltro ? [dFiltro] : Object.keys(rutasBase).sort();

      Object.keys(rutasBase).forEach(k => totalRutas += rutasBase[k].rutas.length);

      distritosAProcesar.forEach(dId => {
        const dist = rutasBase[dId];
        if (!dist) return;

        const dNombre = dist.nombre;
        const dNombreLower = dNombre.toLowerCase();

        for (let i = 0; i < dist.rutas.length; i++) {
          const r = dist.rutas[i];
          const rLower = r.toLowerCase();

          if (!q || rLower.includes(q) || dId.includes(q) || dNombreLower.includes(q)) {
            coincidencias++;
            filasHtml.push(`
              <tr>
                <td><strong>${dId}</strong></td>
                <td>${dNombre}</td>
                <td><code>${r}</code></td>
                <td style="text-align:center; white-space: nowrap;">
                  <button class="btn-action-edit" onclick="abrirModalEdicion('${dId}', '${r}')"><i class="fas fa-edit"></i> Editar</button>
                  <button class="btn-action-delete" onclick="borrarRuta('${dId}', '${r}')"><i class="fas fa-trash-alt"></i> Quitar</button>
                </td>
              </tr>
            `);
          }
        }
      });

      tbody.innerHTML = filasHtml.join('');

      const contador = document.getElementById('contadorUls');
      if (q || dFiltro) {
        contador.innerText = `Mostrando: ${coincidencias} de ${totalRutas} rutas`;
      } else {
        contador.innerText = `Total de Rutas: ${totalRutas}`;
      }
    }

    let debounceTimer;
    document.getElementById('filtroUls').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderTabla, 120);
    });

    document.getElementById('filtroDistritoSelect').addEventListener('change', renderTabla);

    document.getElementById('btnAgregarRuta').addEventListener('click', () => {
      const dId = document.getElementById('ulDistritoSelect').value;
      const r = document.getElementById('ulRutaInput').value.trim().toUpperCase();
      if (!r) return alert('Ingresa un código de ruta válido.');
      if (!rutasBase[dId]) return alert('Distrito inválido.');
      if (rutasBase[dId].rutas.includes(r)) return alert(`La ruta ${r} ya existe en el distrito ${dId}.`);

      rutasBase[dId].rutas.push(r);
      rutasBase[dId].rutas.sort();
      saveRutasBase(rutasBase);
      document.getElementById('ulRutaInput').value = '';
      renderTabla();
    });

    window.borrarRuta = function(dId, r) {
      if (confirm(`¿Quitar la ruta ${r} del distrito ${dId}?`)) {
        rutasBase[dId].rutas = rutasBase[dId].rutas.filter(x => x !== r);
        saveRutasBase(rutasBase);
        renderTabla();
      }
    };

    window.abrirModalEdicion = function(dId, r) {
      edicionActual = { distritoOrig: dId, rutaOrig: r };
      document.getElementById('editDistritoSelect').value = dId;
      document.getElementById('editRutaInput').value = r;
      document.getElementById('modalEditarRuta').style.display = 'flex';
    };

    window.cerrarModalEdicion = function() {
      document.getElementById('modalEditarRuta').style.display = 'none';
      edicionActual = { distritoOrig: null, rutaOrig: null };
    };

    document.getElementById('btnGuardarEdicion').addEventListener('click', () => {
      const nuevoDistrito = document.getElementById('editDistritoSelect').value;
      const nuevaRuta = document.getElementById('editRutaInput').value.trim().toUpperCase();

      if (!nuevaRuta) return alert('El código de ruta no puede estar vacío.');

      const { distritoOrig, rutaOrig } = edicionActual;

      if (distritoOrig === nuevoDistrito && rutaOrig === nuevaRuta) {
        cerrarModalEdicion();
        return;
      }

      if (distritoOrig !== nuevoDistrito || rutaOrig !== nuevaRuta) {
        if (rutasBase[nuevoDistrito].rutas.includes(nuevaRuta)) {
          return alert(`La ruta ${nuevaRuta} ya existe en el distrito ${nuevoDistrito}.`);
        }
      }

      rutasBase[distritoOrig].rutas = rutasBase[distritoOrig].rutas.filter(x => x !== rutaOrig);
      rutasBase[nuevoDistrito].rutas.push(nuevaRuta);
      rutasBase[nuevoDistrito].rutas.sort();

      saveRutasBase(rutasBase);
      cerrarModalEdicion();
      renderTabla();
    });

    document.getElementById('btnResetRutasDefault').addEventListener('click', () => {
      if (confirm('¿Restablecer el catálogo al original del sistema? Se perderán las rutas personalizadas agregadas.')) {
        rutasBase = JSON.parse(JSON.stringify(catalogoInicial));
        saveRutasBase(rutasBase);
        renderSelectDistritos();
        renderTabla();
      }
    });

    renderSelectDistritos();
    renderTabla();
  </script>
</body>
</html>
