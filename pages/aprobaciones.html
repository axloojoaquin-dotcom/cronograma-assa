<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandeja de Aprobaciones - Negociación de Cronogramas</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Jspreadsheet CE y Jsuites -->
  <script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4.13.3/dist/index.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4.13.3/dist/jspreadsheet.min.css" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/jsuites@4.3.2/dist/jsuites.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites@4.3.2/dist/jsuites.min.css" type="text/css" />

  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header></header>

  <div class="container">
    
    <!-- BANDEJA DE PROPUESTAS -->
    <div class="section-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2>Bandeja de Cronogramas</h2>
        <button class="btn-sub" id="btnRecargarBandeja"><i class="fas fa-sync-alt"></i> Actualizar Bandeja</button>
      </div>
      <p class="section-desc">Revisa y gestiona las propuestas de cronograma enviadas entre el Administrador y el Operador en tiempo real[cite: 1, 2].</p>
      
      <div id="listaAprobaciones">
        <p style="text-align: center; color: #777; padding: 25px;"><i class="fas fa-spinner fa-spin"></i> Cargando propuestas desde Supabase...</p>
      </div>
    </div>

    <!-- PANEL DE REVISIÓN Y NEGOCIACIÓN -->
    <div class="section-card" id="editorPropuesta" style="display: none;">
      <div class="table-header-actions">
        <div>
          <h2 id="tituloEditorPropuesta">Revisión de Propuesta</h2>
          <span id="badgeEstadoActual" class="status-badge" style="display: inline-block; margin-top: 4px;"></span>
        </div>
        
        <!-- Acciones cuando revisa el Operador -->
        <div style="display: none; gap: 10px;" id="botonesOperador">
          <button class="btn-main btn-warning" id="btnDevolverAdmin">
            <i class="fas fa-undo"></i> Devolver con Modificaciones
          </button>
          <button class="btn-main btn-save" id="btnAceptarOperador">
            <i class="fas fa-check"></i> Aceptar Cronograma
          </button>
        </div>

        <!-- Acciones cuando revisa el Administrador -->
        <div style="display: none; gap: 10px;" id="botonesAdminRevision">
          <button class="btn-main btn-info" id="btnAdminReenviarModif">
            <i class="fas fa-paper-plane"></i> Enviar Nuevas Modificaciones
          </button>
          <button class="btn-main btn-save" id="btnAdminAceptarDefinitivo">
            <i class="fas fa-check-double"></i> Aceptar Definitivo
          </button>
        </div>
      </div>

      <p style="color: #666; margin-bottom: 15px; font-size: 0.95rem;" id="instruccionEditor"></p>
      <div id="spreadsheet-aprobacion"></div>
    </div>

  </div>

  <!-- Librería Oficial Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared.js"></script>

  <script>
    const usuarioActual = verificarSesion();
    if (!usuarioActual) {
      window.location.replace('login.html');
    }

    renderizarNavbar('aprobaciones');

    let propuestasEnMemoria = [];
    let propuestaActiva = null;
    let tablaEditor = null;

    // Helpers locales para mantener sincronizado el Historial y Consolidado acumulado
    function acumularDefinitivoLocal(p) {
      let def = JSON.parse(localStorage.getItem('assa_consolidados_definitivos_v1')) || {};
      if (!def[p.periodo]) def[p.periodo] = { Rosario: [], Distrito: [] };

      p.datos.forEach(fila => {
        const esRosario = (String(fila[0]) === '109');
        const target = esRosario ? 'Rosario' : 'Distrito';
        const idx = def[p.periodo][target].findIndex(r => r[1] === fila[1]);
        if (idx >= 0) def[p.periodo][target][idx] = fila;
        else def[p.periodo][target].push(fila);
      });
      localStorage.setItem('assa_consolidados_definitivos_v1', JSON.stringify(def));
    }

    function registrarHistorialLocal(p, estadoTexto) {
      const hist = JSON.parse(localStorage.getItem('assa_historial_versiones_v1')) || [];
      hist.unshift({
        periodo: p.periodo,
        version: p.version || 1,
        tipo: (p.datos && p.datos.length > 0 && String(p.datos[0][0]) === '109') ? 'Rosario' : 'Distrito',
        creador: p.creador,
        ultimoActor: usuarioActual.username,
        registros: p.datos ? p.datos.length : 0,
        fechaRegistro: new Date().toLocaleString(),
        estado: estadoTexto
      });
      localStorage.setItem('assa_historial_versiones_v1', JSON.stringify(hist));
    }

    // 1. Cargar y renderizar propuestas desde Supabase
    async function renderBandeja() {
      const cont = document.getElementById('listaAprobaciones');
      cont.innerHTML = '<p style="text-align: center; color: #777; padding: 25px;"><i class="fas fa-spinner fa-spin"></i> Cargando propuestas desde Supabase...</p>';

      propuestasEnMemoria = await getPropuestasDB();

      if (!propuestasEnMemoria || propuestasEnMemoria.length === 0) {
        cont.innerHTML = '<p style="text-align: center; color: #888; padding: 25px;">No hay cronogramas registrados en la base de datos.</p>';
        return;
      }

      cont.innerHTML = '';
      propuestasEnMemoria.forEach(p => {
        const esAprob = p.estado.includes('Aprobado') || p.estado.includes('Acordado');
        const badgeClass = esAprob ? 'status-aprobado' : (p.estado.includes('Devuelta') || p.estado.includes('Modificada') ? 'status-devuelto' : 'status-pendiente');
        const totalRegistros = Array.isArray(p.datos) ? p.datos.length : 0;

        cont.innerHTML += `
          <div class="propuesta-card">
            <div>
              <h3 style="color:#005f85; margin-bottom: 4px;">Periodo ${p.periodo} - Versión ${p.version || 1}</h3>
              <p style="font-size:0.85rem; color:#666;">
                Iniciado por: <strong>${p.creador || 'Desconocido'}</strong> | Registros: ${totalRegistros}
              </p>
            </div>
            <div style="display:flex; align-items:center; gap: 12px;">
              <span class="status-badge ${badgeClass}">${p.estado}</span>
              <button class="btn-main" onclick="abrirPropuesta('${p.id}')"><i class="fas fa-eye"></i> Revisar</button>
            </div>
          </div>
        `;
      });

      actualizarContadorNavbar();
    }

    // 2. Abrir editor y configurar permisos por rol
    window.abrirPropuesta = function(id) {
      propuestaActiva = propuestasEnMemoria.find(x => String(x.id) === String(id));
      if (!propuestaActiva) return;

      const editor = document.getElementById('editorPropuesta');
      editor.style.display = 'block';
      document.getElementById('tituloEditorPropuesta').innerText = `Revisando Periodo ${propuestaActiva.periodo} (V${propuestaActiva.version || 1})`;

      const badge = document.getElementById('badgeEstadoActual');
      const esAprob = propuestaActiva.estado.includes('Aprobado') || propuestaActiva.estado.includes('Acordado');
      badge.innerText = propuestaActiva.estado;
      badge.className = 'status-badge ' + (esAprob ? 'status-aprobado' : (propuestaActiva.estado.includes('Devuelta') || propuestaActiva.estado.includes('Modificada') ? 'status-devuelto' : 'status-pendiente'));

      const esAdmin = (usuarioActual.perfil === 'Administrador');
      const esOp = (usuarioActual.perfil === 'Operador');
      const esSoloLectura = (usuarioActual.perfil === 'Lectura') || esAprob;

      const panelOperador = document.getElementById('botonesOperador');
      const panelAdmin = document.getElementById('botonesAdminRevision');
      const instruccion = document.getElementById('instruccionEditor');

      if (esSoloLectura) {
        panelOperador.style.display = 'none';
        panelAdmin.style.display = 'none';
        instruccion.innerHTML = `🔒 <strong>Modo Visualización:</strong> Este cronograma se encuentra cerrado o tu perfil posee permisos de solo lectura[cite: 1, 2].`;
      } else if (esAdmin) {
        panelOperador.style.display = 'none';
        panelAdmin.style.display = 'flex';
        instruccion.innerHTML = `ℹ️ <strong>Modo Administrador:</strong> Puedes validar la propuesta modificada como definitiva, o editar valores y presionar <strong>Enviar Nuevas Modificaciones</strong> para generar una nueva versión (V${(propuestaActiva.version || 1) + 1})[cite: 1, 2].`;
      } else if (esOp) {
        panelOperador.style.display = 'flex';
        panelAdmin.style.display = 'none';
        instruccion.innerHTML = `⚠️ <strong>Modo Operador:</strong> Solo tienes habilitada la modificación de la columna <strong>Lectura</strong>[cite: 1, 2]. Al terminar, puedes aceptar o devolver con modificaciones[cite: 1, 2].`;
      }

      // Configuración de columnas Jspreadsheet
      const cols = [
        { type: 'text', title: 'Distrito', width: 75, readOnly: esOp || esSoloLectura },
        { type: 'text', title: 'Ruta', width: 95, readOnly: esOp || esSoloLectura },
        { type: 'text', title: 'Generación', width: 130, readOnly: true },
        { type: 'text', title: 'Fecha Planificada', width: 140, readOnly: true },
        { type: 'text', title: 'Captura SISA', width: 120, readOnly: true },
        { type: 'text', title: 'Lectura', width: 120, readOnly: esSoloLectura },
        { type: 'text', title: 'Porción', width: 70, readOnly: esOp || esSoloLectura },
        { type: 'text', title: 'Turno', width: 175, readOnly: true },
        { type: 'text', title: 'Lectura Anterior', width: 130, readOnly: true },
        { type: 'text', title: 'Días Consumo', width: 100, readOnly: true }
      ];

      const cont = document.getElementById('spreadsheet-aprobacion');
      if (tablaEditor) { 
        try { jspreadsheet.destroy(cont); } catch(e){} 
      }
      cont.innerHTML = '';

      tablaEditor = jspreadsheet(cont, {
        data: propuestaActiva.datos,
        columns: cols,
        onchange: (inst, cell, x, y, val) => {
          if (parseInt(x) === 5) {
            const nueva = parseDate(val);
            if (nueva) {
              const r = inst.jexcel.getValueFromCoords(1, y);
              const ant = parseDate(inst.jexcel.getValueFromCoords(8, y));
              
              if (ant) {
                const diff = Math.round((nueva.getTime() - ant.getTime()) / (1000 * 86400));
                inst.jexcel.setValueFromCoords(9, y, diff);
              }
              inst.jexcel.setValueFromCoords(2, y, formatDate(agregarDiasHabiles(nueva, -3)));
              inst.jexcel.setValueFromCoords(3, y, formatDate(nueva));
              inst.jexcel.setValueFromCoords(4, y, formatDate(agregarDiasHabiles(nueva, 2)));
              inst.jexcel.setValueFromCoords(7, y, formatTurno(r, nueva));
            }
          }
        }
      });

      editor.scrollIntoView({ behavior: 'smooth' });
    };

    // 3. Acciones de Operador hacia Supabase
    document.getElementById('btnDevolverAdmin').addEventListener('click', async () => {
      if (!propuestaActiva || !tablaEditor) return;
      const btn = document.getElementById('btnDevolverAdmin');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Guardando...`;

      const nuevaVersion = (propuestaActiva.version || 1) + 1;
      const nuevoEstado = `Pendiente de Aprobación (Devuelta Modificada V${nuevaVersion})`;
      const datosActualizados = tablaEditor.getData();

      const resultado = await actualizarPropuestaDB(propuestaActiva.id, {
        datos: datosActualizados,
        version: nuevaVersion,
        estado: nuevoEstado
      });

      if (resultado) {
        propuestaActiva.datos = datosActualizados;
        propuestaActiva.version = nuevaVersion;
        registrarHistorialLocal(propuestaActiva, nuevoEstado);
        alert(`Propuesta devuelta al Administrador con Versión V${nuevaVersion}.`);
        document.getElementById('editorPropuesta').style.display = 'none';
        renderBandeja();
      }
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-undo"></i> Devolver con Modificaciones`;
    });

    document.getElementById('btnAceptarOperador').addEventListener('click', async () => {
      if (!propuestaActiva || !tablaEditor) return;
      const btn = document.getElementById('btnAceptarOperador');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Guardando...`;

      const nuevoEstado = 'Aprobado';
      const datosActualizados = tablaEditor.getData();

      const resultado = await actualizarPropuestaDB(propuestaActiva.id, {
        datos: datosActualizados,
        estado: nuevoEstado
      });

      if (resultado) {
        propuestaActiva.datos = datosActualizados;
        acumularDefinitivoLocal(propuestaActiva);
        registrarHistorialLocal(propuestaActiva, nuevoEstado);
        alert('¡Cronograma acordado y consolidado con éxito!');
        document.getElementById('editorPropuesta').style.display = 'none';
        renderBandeja();
      }
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-check"></i> Aceptar Cronograma`;
    });

    // 4. Acciones de Administrador hacia Supabase
    document.getElementById('btnAdminAceptarDefinitivo').addEventListener('click', async () => {
      if (!propuestaActiva || !tablaEditor) return;
      const btn = document.getElementById('btnAdminAceptarDefinitivo');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Guardando...`;

      const nuevoEstado = 'Aprobado';
      const datosActualizados = tablaEditor.getData();

      const resultado = await actualizarPropuestaDB(propuestaActiva.id, {
        datos: datosActualizados,
        estado: nuevoEstado
      });

      if (resultado) {
        propuestaActiva.datos = datosActualizados;
        acumularDefinitivoLocal(propuestaActiva);
        registrarHistorialLocal(propuestaActiva, nuevoEstado);
        alert(`Cronograma para el periodo ${propuestaActiva.periodo} cerrado definitivamente.`);
        document.getElementById('editorPropuesta').style.display = 'none';
        renderBandeja();
      }
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-check-double"></i> Aceptar Definitivo`;
    });

    document.getElementById('btnAdminReenviarModif').addEventListener('click', async () => {
      if (!propuestaActiva || !tablaEditor) return;
      const btn = document.getElementById('btnAdminReenviarModif');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Guardando...`;

      const nuevaVersion = (propuestaActiva.version || 1) + 1;
      const nuevoEstado = `Pendiente de Aprobación (Propuesta Admin V${nuevaVersion})`;
      const datosActualizados = tablaEditor.getData();

      const resultado = await actualizarPropuestaDB(propuestaActiva.id, {
        datos: datosActualizados,
        version: nuevaVersion,
        estado: nuevoEstado
      });

      if (resultado) {
        propuestaActiva.datos = datosActualizados;
        propuestaActiva.version = nuevaVersion;
        registrarHistorialLocal(propuestaActiva, nuevoEstado);
        alert(`Se generó la versión V${nuevaVersion} y se reenvió al Operador.`);
        document.getElementById('editorPropuesta').style.display = 'none';
        renderBandeja();
      }
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-paper-plane"></i> Enviar Nuevas Modificaciones`;
    });

    document.getElementById('btnRecargarBandeja').addEventListener('click', renderBandeja);

    renderBandeja();
  </script>
</body>
</html>
